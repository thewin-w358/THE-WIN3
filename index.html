      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 14px 44px;
    }

    .app {
      width: min(760px, 100%);
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
      text-shadow: 0 3px 14px rgba(0,0,0,.75);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 50px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff2a9 0%, #ffc647 45%, #d47b16 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 0 #6e2b0b);
    }

    .brand p {
      margin: 8px 0 0;
      font-size: clamp(14px, 3.7vw, 19px);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff5d6;
    }

    .panel {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px;
      box-shadow:
        0 20px 50px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .result-box {
      min-height: 112px;
      border: 2px solid rgba(255, 203, 85, .7);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 190, 63, .18), transparent 55%),
        rgba(55, 22, 8, .72);
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      box-shadow: inset 0 0 22px rgba(255, 165, 42, .12);
    }

    #result {
      font-size: clamp(46px, 12vw, 72px);
      font-weight: 900;
      color: #ffe87d;
      letter-spacing: 1px;
      text-shadow:
        0 0 12px rgba(255, 189, 48, .65),
        0 3px 0 #7a2d08;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      color: #ffe9bd;
    }

    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(255, 213, 122, .42);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 17px;
      font-weight: 700;
      color: #402016;
      background: rgba(255, 250, 235, .94);
      outline: none;
      transition: .2s ease;
    }

    input:focus {
      border-color: #ffc85a;
      box-shadow: 0 0 0 3px rgba(255, 190, 69, .18);
      transform: translateY(-1px);
    }

    .action {
      margin-top: 18px;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff7df;
      background: linear-gradient(180deg, #ff9d34 0%, #d95216 100%);
      box-shadow: 0 8px 0 #862a0b, 0 14px 26px rgba(0,0,0,.32);
      transition: transform .15s ease, filter .15s ease;
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #862a0b, 0 8px 16px rgba(0,0,0,.25);
    }

    button:disabled {
      cursor: not-allowed;
      filter: grayscale(.3) brightness(.72);
      transform: none;
      box-shadow: 0 5px 0 #603326;
    }

    .scan-area {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 14px;
      background: rgba(13, 8, 5, .52);
      border: 1px solid rgba(255, 216, 124, .22);
    }

    .scan-text {
      min-height: 24px;
      font-size: 14px;
      font-weight: 700;
      color: #fff0c6;
      margin-bottom: 9px;
    }

    .progress-track {
      height: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.3);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff7c22, #ffd95a, #fff3a6);
      box-shadow: 0 0 14px rgba(255, 207, 72, .65);
      transition: width .18s linear;
    }

    .progress-num {
      margin-top: 7px;
      text-align: right;
      font-size: 13px;
      color: #ffd982;
      font-weight: 800;
    }

    .notice {
      min-height: 22px;
      margin-top: 12px;
      text-align: center;
      color: #ffd6c2;
      font-size: 14px;
      font-weight: 700;
    }

    .login-card {
      width: min(420px, 100%);
      padding: 26px;
      border-radius: 22px;
      background: rgba(42, 18, 10, .88);
      border: 1px solid rgba(255, 214, 122, .38);
      box-shadow: 0 24px 60px rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
    }

    .login-card h2 {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 28px;
    }

    .login-card p {
      margin: 0 0 18px;
      color: #ffe8c3;
      font-size: 14px;
    }

    .login-card input {
      text-align: center;
      margin-bottom: 14px;
    }

    .login-error {
      min-height: 22px;
      margin-top: 12px;
      color: #ffb59e;
      font-weight: 700;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 560px) {
      body {
        background-attachment: scroll;
        padding: 18px 10px 30px;
      }

      .panel {
        padding: 17px 14px;
        border-radius: 18px;
      }

      .inputs {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .result-box {
        min-height: 98px;
      }
    }
  </style>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3a1e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="虎小妹">
  <link rel="apple-touch-icon" href="icon-512.png">
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <h2>虎小妹 AI選房系統</h2>
      <p>DOIN經銷商W358專屬</p>
      <input id="passwordInput" type="password" placeholder="請輸入進入密碼" autocomplete="off" />
      <button id="loginBtn" type="button">進入系統</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <main class="app">
    <header class="brand">
      <h1>虎小妹 AI選房系統</h1>
      <p>DOIN經銷商W358專屬</p>
    </header>

    <section class="panel">
      <h3 class="section-title">分析房號開出機率</h3>
      <div class="result-box">
        <div id="result">--.-%</div>
      </div>

      <h3 class="section-title">AI 數據輸入</h3>
      <div class="inputs">
        <div class="field">
          <label for="unopened">未開轉數分析</label>
          <input id="unopened" inputmode="decimal" value="11" />
        </div>

        <div class="field">
          <label for="previous1">前一轉開分析</label>
          <input id="previous1" inputmode="decimal" value="5" />
        </div>

        <div class="field">
          <label for="previous2">前二轉開分析</label>
          <input id="previous2" inputmode="decimal" value="192" />
        </div>

        <div class="field">
          <label for="scoreRate">得分率分析</label>
          <input id="scoreRate" inputmode="decimal" value="97.83%" />
        </div>

        <div class="field full">
          <label for="totalBet">總下注額分析</label>
          <input id="totalBet" inputmode="decimal" value="210,076.0" />
        </div>
      </div>

      <div class="action">
        <button id="calculateBtn" type="button">開始 AI 分析計算</button>
      </div>

      <div class="scan-area" id="scanArea">
        <div class="scan-text" id="scanText">正在讀取數據...</div>
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-num" id="progressNum">0%</div>
      </div>

      <div class="notice" id="notice"></div>
    </section>
  </main>

  <script>
    const CORRECT_PASSWORD = "aaa888";
    const loginOverlay = document.getElementById("loginOverlay");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");

    function login() {
      if (passwordInput.value === CORRECT_PASSWORD) {
        loginOverlay.classList.add("hidden");
        loginError.textContent = "";
      } else {
        loginError.textContent = "密碼錯誤，請重新輸入";
        passwordInput.select();
      }
    }

    loginBtn.addEventListener("click", login);
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    const ids = ["unopened", "previous1", "previous2", "scoreRate", "totalBet"];
    const inputs = ids.map(id => document.getElementById(id));
    const calculateBtn = document.getElementById("calculateBtn");
    const result = document.getElementById("result");
    const scanArea = document.getElementById("scanArea");
    const scanText = document.getElementById("scanText");
    const progressBar = document.getElementById("progressBar");
    const progressNum = document.getElementById("progressNum");
    const notice = document.getElementById("notice");

    function normalizeNumber(value) {
      return value.trim().replace(/,/g, "").replace(/%/g, "");
    }

    function allValid() {
      return inputs.every(input => {
        const v = normalizeNumber(input.value);
        return v !== "" && Number.isFinite(Number(v));
      });
    }

    // 固定雜湊：相同五組輸入值，永遠得到相同結果
    function hashString(str) {
      let hash = 2166136261;
      for (let i = 0; i < str.length; i++) {
        hash ^= str.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function deterministicPercent(values) {
      const seed = hashString(values.join("|"));
      const tenth = seed % 201; // 0～200，共 201 個值
      return (75 + tenth / 10).toFixed(1) + "%";
    }

    const statusSteps = [
      { at: 0, text: "正在讀取數據..." },
      { at: 18, text: "AI 正在掃描歷史轉數..." },
      { at: 38, text: "正在比對前次開出資料..." },
      { at: 58, text: "正在分析得分率與下注額..." },
      { at: 78, text: "AI 模型正在整合數據..." },
      { at: 94, text: "即將完成機率計算..." }
    ];

    calculateBtn.addEventListener("click", () => {
      notice.textContent = "";

      if (!allValid()) {
        notice.textContent = "五個欄位都必須輸入有效數字後才能計算";
        const invalid = inputs.find(input => {
          const v = normalizeNumber(input.value);
          return v === "" || !Number.isFinite(Number(v));
        });
        if (invalid) invalid.focus();
        return;
      }

      const values = inputs.map(input => normalizeNumber(input.value));
      const finalValue = deterministicPercent(values);

      calculateBtn.disabled = true;
      inputs.forEach(input => input.disabled = true);
      scanArea.style.display = "block";
      progressBar.style.width = "0%";
      progressNum.textContent = "0%";
      result.textContent = "分析中";
      scanText.textContent = statusSteps[0].text;

      const duration = 8000;
      const start = performance.now();

      function animate(now) {
        const elapsed = now - start;
        const progress = Math.min(100, Math.floor((elapsed / duration) * 100));

        progressBar.style.width = progress + "%";
        progressNum.textContent = progress + "%";

        let currentText = statusSteps[0].text;
        for (const step of statusSteps) {
          if (progress >= step.at) currentText = step.text;
        }
        scanText.textContent = currentText;

        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          progressBar.style.width = "100%";
          progressNum.textContent = "100%";
          scanText.textContent = "AI 分析完成";
          result.textContent = finalValue;
          calculateBtn.disabled = false;
          inputs.forEach(input => input.disabled = false);
          notice.textContent = "分析完成：相同輸入數值會得到相同結果";
        }
      }

      requestAnimationFrame(animate);
    });
  </script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js')); }
</script>
</body>
</html>
